services:
  - type: web
    name: chatgpt-platform-api
    env: python
    region: oregon
    plan: free
    rootDir: ChatGPT-Platform/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chatgpt-platform-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_NAME
        value: ChatGPT Platform

databases:
  - name: chatgpt-platform-db
    databaseName: chatgpt_platform
    user: chatgpt_platform_user
    plan: free
